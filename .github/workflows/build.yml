name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: End-to-end tests (real browser, virtual display)
        run: |
          npm install --no-save playwright@1.63.0
          xvfb-run -a npm run test:e2e

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers
        shell: bash
        run: |
          PUBLISH=${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
          case "$RUNNER_OS" in
            Windows)
              npx electron-builder --win --x64 --publish $PUBLISH
              npx electron-builder --win --arm64 --publish $PUBLISH
              ;;
            Linux) npx electron-builder --linux --publish $PUBLISH ;;
            macOS) npx electron-builder --mac --publish $PUBLISH ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: LionsBrows-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
