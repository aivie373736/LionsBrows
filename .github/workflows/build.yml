name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: End-to-end tests (real browser, virtual display)
        run: |
          npm install --no-save playwright@1.63.0
          xvfb-run -a npm run test:e2e

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install castLabs EVS for Widevine signing
        if: env.EVS_ACCOUNT_NAME != '' && runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python -m pip install --upgrade castlabs-evs; else python3 -m pip install --break-system-packages --upgrade castlabs-evs; fi
      - name: Build installers
        shell: bash
        run: |
          PUBLISH=${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
          case "$RUNNER_OS" in
            Windows) npx electron-builder --win --publish $PUBLISH ;;
            Linux) npx electron-builder --linux --publish $PUBLISH ;;
            macOS) npx electron-builder --mac --publish $PUBLISH ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload Windows x64
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LionsBrows-Windows-x64
          path: dist/LionsBrows-win-x64.exe
          compression-level: 0
          if-no-files-found: error
      - name: Upload Windows ARM
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LionsBrows-Windows-ARM
          path: dist/LionsBrows-win-arm64.exe
          compression-level: 0
          if-no-files-found: error
      - name: Upload macOS Apple silicon
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LionsBrows-macOS-AppleSilicon
          path: dist/LionsBrows-mac-arm64.dmg
          compression-level: 0
          if-no-files-found: error
      - name: Upload macOS Intel
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LionsBrows-macOS-Intel
          path: dist/LionsBrows-mac-x64.dmg
          compression-level: 0
          if-no-files-found: error
      - name: Upload Linux x64
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LionsBrows-Linux-x64
          path: dist/LionsBrows-linux-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error
      - name: Upload Linux ARM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LionsBrows-Linux-ARM
          path: dist/LionsBrows-linux-arm64.AppImage
          compression-level: 0
          if-no-files-found: error
