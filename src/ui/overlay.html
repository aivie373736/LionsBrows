<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data: lions:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Command bar</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="palette" role="dialog" aria-label="Command bar">
      <div id="prompt-title" hidden></div>
      <div class="input-row">
        <span id="lead"></span>
        <input id="q" type="text" autocomplete="off" spellcheck="false" aria-controls="results" />
        <kbd>Esc</kbd>
      </div>
      <div id="results" role="listbox"></div>
      <div class="hints" id="hints"></div>
    </div>
    <script src="../shared/icons.js"></script>
    <script src="../shared/locales/de.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
