<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Bubble</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="bubble.css" />
  </head>
  <body>
    <div id="card" class="card" role="dialog" aria-labelledby="title" hidden>
      <header>
        <span class="lead" id="lead"></span>
        <h1 id="title"></h1>
        <button class="icon-btn" id="close" title="Close" aria-label="Close"></button>
      </header>
      <label class="field">
        <span>Username</span>
        <input id="username" type="text" spellcheck="false" autocomplete="off" />
      </label>
      <label class="field">
        <span>Password</span>
        <span class="pw">
          <input id="password" type="password" readonly />
          <button class="icon-btn" id="reveal" type="button" title="Show password" aria-label="Show password"></button>
        </span>
      </label>
      <footer>
        <button class="button" id="secondary" type="button"></button>
        <button class="button primary" id="primary" type="button"></button>
      </footer>
    </div>
    <div id="site" class="card" role="dialog" aria-labelledby="site-title" hidden>
      <header>
        <span class="lead" id="site-lead"></span>
        <h1 id="site-title"></h1>
        <button class="icon-btn" id="site-close" title="Close" aria-label="Close"></button>
      </header>
      <div class="status">
        <div id="site-status"></div>
        <div class="sub" id="site-status-sub"></div>
      </div>
      <h2>Permissions</h2>
      <div id="site-perms"></div>
      <div class="site-row">
        <span class="row-icon" id="site-cookie-icon"></span>
        <div class="row-text">
          <div>Cookies and site data</div>
          <div class="sub" id="site-cookies"></div>
        </div>
        <button class="button small" id="site-clear" type="button">Delete</button>
      </div>
      <footer>
        <button class="button" id="site-settings" type="button">Site settings</button>
        <button class="button primary" id="site-reload" type="button" hidden>Reload to apply</button>
      </footer>
    </div>
    <div id="qr" class="card" role="dialog" aria-labelledby="qr-title" hidden>
      <header>
        <span class="lead" id="qr-lead"></span>
        <h1 id="qr-title">Scan with your phone</h1>
        <button class="icon-btn" id="qr-close" title="Close" aria-label="Close"></button>
      </header>
      <div class="qr-code" id="qr-code"></div>
      <div class="qr-url" id="qr-url"></div>
      <footer>
        <button class="button" id="qr-copy" type="button">Copy link</button>
      </footer>
    </div>
    <script src="../shared/icons.js"></script>
    <script src="../shared/locales/de.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="bubble.js"></script>
  </body>
</html>
