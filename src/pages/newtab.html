<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>New Tab</title>
    <link rel="icon" href="lions://assets/logo.svg" />
    <link rel="stylesheet" href="lions://assets/theme.css" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <div id="bg"></div>
    <button id="customize-btn" class="corner-btn" title="Customize this page" aria-label="Customize this page"></button>
    <main class="nt">
      <img class="logo" src="lions://assets/logo.svg" alt="LionsBrows" />
      <h1 id="greeting" hidden></h1>
      <p id="private-note" hidden></p>
      <div class="search-wrap">
        <form id="search-form" autocomplete="off" role="search">
          <button type="button" id="engine-btn" aria-haspopup="listbox" aria-expanded="false"></button>
          <input id="search" type="text" spellcheck="false" autofocus aria-label="Search or enter address" />
          <button type="submit" id="go" title="Search" aria-label="Search"></button>
        </form>
        <div id="engine-menu" role="listbox" hidden></div>
      </div>
      <div id="sites"></div>
    </main>
    <footer id="stats"></footer>
    <aside id="customize" hidden>
      <header>
        <h2>Customize</h2>
        <button class="icon-btn" id="customize-close" title="Close" aria-label="Close"></button>
      </header>
      <div class="cz-body" id="customize-body"></div>
    </aside>
    <script src="lions://assets/icons.js"></script>
    <script src="lions://assets/strings.js"></script>
    <script src="lions://assets/i18n.js"></script>
    <script src="lions://assets/engines.js"></script>
    <script src="common.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
