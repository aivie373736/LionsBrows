<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Can't open this page</title>
    <link rel="icon" href="lions://assets/logo.svg" />
    <link rel="stylesheet" href="lions://assets/theme.css" />
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        display: grid;
        place-items: center;
      }
      .err {
        max-width: 560px;
        padding: 40px 28px;
      }
      .err-icon {
        width: 48px;
        height: 48px;
        color: var(--text-3);
      }
      .err-icon svg {
        width: 48px;
        height: 48px;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 20px 0 10px;
      }
      p {
        color: var(--text-2);
        line-height: 1.55;
        margin: 0 0 8px;
      }
      .url {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text);
        word-break: break-all;
      }
      .code {
        color: var(--text-3);
        font-size: 12px;
        font-family: var(--mono);
        margin-top: 18px;
      }
      .actions {
        margin-top: 26px;
        display: flex;
        gap: 10px;
      }
      body.danger {
        background: color-mix(in srgb, var(--danger) 7%, var(--bg));
      }
      body.danger .err-icon {
        color: var(--danger);
      }
      body.danger .code {
        font-family: var(--font);
        font-size: 12.5px;
      }
      .button.subtle {
        border-color: transparent;
        background: transparent;
        color: var(--text-2);
        font-weight: 500;
      }
      .button.subtle:hover {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main class="err">
      <div class="err-icon" id="icon"></div>
      <h1 id="title"></h1>
      <p id="desc"></p>
      <p class="url" id="url"></p>
      <div class="actions">
        <button class="button primary" id="retry">Reload</button>
        <button class="button" id="back">Go back</button>
      </div>
      <div class="code" id="code"></div>
    </main>
    <script src="lions://assets/icons.js"></script>
    <script src="lions://assets/strings.js"></script>
    <script src="lions://assets/i18n.js"></script>
    <script src="error.js"></script>
  </body>
</html>
